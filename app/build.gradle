plugins { id 'com.android.application' }

// Every release must be signed with the same key, or Android refuses to install it over the old one
// and the user has to uninstall first. The key's location and passwords live in the gitignored
// local.properties (phsign.*); builds without them fall back to the machine's debug key.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def pinnedKey = localProps.getProperty('phsign.store')

android {
    namespace = 'dev.voidwager.phonehealth'
    compileSdk = 36
    defaultConfig {
        applicationId = 'dev.voidwager.phonehealth'
        minSdk = 30
        targetSdk = 36
        // -PphVersionCode / -PphVersionName exist only to build an "older" copy for update testing.
        versionCode = (project.findProperty('phVersionCode') ?: 4) as int
        versionName = project.findProperty('phVersionName') ?: '1.3'
    }
    signingConfigs {
        pinned {
            if (pinnedKey != null) {
                storeFile = file(pinnedKey)
                storePassword = localProps.getProperty('phsign.storePassword')
                keyAlias = localProps.getProperty('phsign.alias')
                keyPassword = localProps.getProperty('phsign.keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = pinnedKey != null ? signingConfigs.pinned : signingConfigs.debug
        }
        debug {
            // same key as releases, so a test build can update in place to a published release
            if (pinnedKey != null) signingConfig = signingConfigs.pinned
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds = false }
}
